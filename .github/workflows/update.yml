# 30分ごとに値段と見出しを取り直して、ページ（docs/index.html）を作り直す
name: update

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python run.py
      - name: 変わった所だけ保存する
        run: |
          git config user.name "fx-memo bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data docs
          if git diff --cached --quiet; then
            echo "変化なし"
          else
            git commit -m "データとページを更新"
            git push
          fi
