# 30分ごとに値段と見出しを取り直して、ページ（docs/index.html）を作り直す
name: update

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python run.py
      - name: 変わった所だけ保存する
        run: |
          git config user.name "fx-memo bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data docs
          if git diff --cached --quiet; then
            echo "変化なし"
            exit 0
          fi
          git commit -m "データとページを更新"
          # 待たされている間に別の回が先に保存していたら、最新を取り込んで作り直してから送る
          for n in 1 2 3; do
            git push && exit 0
            echo "先に別の回が保存していたので、最新を取り込んで作り直します（${n}回目）"
            git fetch origin main
            git reset --hard origin/main
            python run.py
            git add data docs
            git diff --cached --quiet && exit 0
            git commit -m "データとページを更新"
          done
          exit 1
